<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="emeraldGlow" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Brand Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2" />
    </linearGradient>

    <!-- Card Fill -->
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#titleGradient); letter-spacing: -0.03em; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 21px; fill: #94A3B8; letter-spacing: -0.01em; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #E2E8F0; }
    .metric-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #38BDF8; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #64748B; text-transform: uppercase; letter-spacing: 0.05em; }
    .code-chip { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 13px; fill: #38BDF8; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Ambient Glow Orbs -->
  <rect width="1200" height="360" rx="16" fill="url(#cyanGlow)" />
  <rect width="1200" height="360" rx="16" fill="url(#emeraldGlow)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Pill Header Category -->
  <g transform="translate(60, 48)">
    <rect width="190" height="32" rx="16" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-width="1" />
    <circle cx="18" cy="16" r="4" fill="#38BDF8" />
    <text x="32" y="21" class="badge-text" fill="#38BDF8">DATA ENGINEERING</text>
  </g>

  <!-- Hero Titles -->
  <text x="60" y="132" class="title">⚡ AI Data Extraction &amp; Cleaning Toolkit</text>
  <text x="60" y="172" class="tagline">Convert messy business PDFs, invoices &amp; web scrapes into formula-backed Excel deliverables.</text>

  <!-- Feature Capsule Badges -->
  <g transform="translate(60, 212)">
    <!-- Capsule 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="8" fill="#1E293B" stroke="url(#badgeBorder)" stroke-width="1.2" />
      <text x="14" y="23" class="code-chip">ƒ(x) Live Excel Formulas</text>
    </g>

    <!-- Capsule 2 -->
    <g transform="translate(195, 0)">
      <rect width="165" height="36" rx="8" fill="#1E293B" stroke="url(#badgeBorder)" stroke-width="1.2" />
      <text x="14" y="23" class="code-chip">⚡ &lt; 45MB RAM Footprint</text>
    </g>

    <!-- Capsule 3 -->
    <g transform="translate(375, 0)">
      <rect width="175" height="36" rx="8" fill="#1E293B" stroke="url(#badgeBorder)" stroke-width="1.2" />
      <text x="14" y="23" class="code-chip">🎯 CRM Multi-Dedupe</text>
    </g>

    <!-- Capsule 4 -->
    <g transform="translate(565, 0)">
      <rect width="195" height="36" rx="8" fill="#1E293B" stroke="url(#badgeBorder)" stroke-width="1.2" />
      <text x="14" y="23" class="code-chip">📊 Executive KPI Register</text>
    </g>
  </g>

  <!-- Glassmorphic Metric Stat Cards (Right Side) -->
  <g transform="translate(850, 48)">
    <!-- Card Container -->
    <rect width="290" height="264" rx="14" fill="url(#cardFill)" stroke="#475569" stroke-width="1.2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.4))" />

    <!-- Stat 1 -->
    <g transform="translate(24, 30)">
      <text x="0" y="22" class="metric-num">24 Hours</text>
      <text x="0" y="42" class="metric-label">Turnaround on Custom Gigs</text>
    </g>

    <line x1="24" y1="92" x2="266" y2="92" stroke="#334155" stroke-width="1" />

    <!-- Stat 2 -->
    <g transform="translate(24, 114)">
      <text x="0" y="22" class="metric-num">$25 – $50</text>
      <text x="0" y="42" class="metric-label">Fixed-Price Starting Tier</text>
    </g>

    <line x1="24" y1="176" x2="266" y2="176" stroke="#334155" stroke-width="1" />

    <!-- Stat 3 -->
    <g transform="translate(24, 198)">
      <text x="0" y="22" class="metric-num" fill="#10B981">100% Free</text>
      <text x="0" y="42" class="metric-label">1-File Proof Sample Before Pay</text>
    </g>
  </g>

  <!-- Bottom Terminal Hint -->
  <g transform="translate(60, 290)">
    <text x="0" y="16" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="13" fill="#64748B">Run instantly:</text>
    <text x="110" y="16" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="13" fill="#38BDF8">python extract_invoice.py samples/ --batch</text>
  </g>
</svg>
